# Claims in README.md that are checked against their sources.
#
# This is not every claim in the README that depends on another repo. Text with
# no entry here is not checked by anything, so a number or status added to the
# README should be added here too.
#
# Why this file exists: every number in the profile used to be hand-copied from
# another repo, and an audit (September 2026) found that the headline numbers
# depended on an undisclosed seed and that pinned-repo descriptions had drifted
# from the READMEs behind them. A profile whose brand is "measured versus
# asserted" cannot carry numbers that nothing re-checks.
#
# scripts/check_profile.py reads this file. For every claim:
#   - `profile` must appear in README.md (whitespace-normalised). So while an
#     entry stays here, its README text cannot be edited or removed without
#     editing the entry too. The reverse is not checked: deleting an entry
#     leaves its README text unchecked;
#   - kind = "source": each `expect` must appear in `path` of `repo` on that
#     repo's default branch (or in a local checkout with --local). The default
#     branch, not a pinned commit, because that is what a reader who follows
#     the link sees;
#   - kind = "url": each `expect` must appear in the page at `url`
#     (upstream documentation the profile relies on);
#   - kind = "reproduce": every number in `profile` must also be in `expect`
#     (the claims step), and each `expect` must appear in the output of
#     scripts/reproduce_scheduler_claims.py (the `reproduce` step, which needs
#     slurm-scheduler-lab installed).
#
# Text is compared after collapsing whitespace and stripping blockquote
# markers, so line wrapping in either README does not matter.

owner = "Zhanyl-tech"

# Used only by the reproduce job in .github/workflows/profile-checks.yml. It
# always re-derives the numbers on slurm-scheduler-lab's default branch, which
# is what a reader who installs the lab gets. When a commit is pinned here it
# also re-derives them at that commit, the one they were taken from. Links and
# source claims ignore this table and always read the default branch.
#
# OWNER: nothing is pinned yet, because the numbers come from uncommitted
# improve/2026-09 work (see the OWNER notes in README.md). After merging it,
# set this to the merge commit's SHA.
[refs]
slurm-scheduler-lab = ""

# ── scheduling evaluation ──────────────────────────────────────────────────

[[claim]]
id = "scheduler-headline"
profile = "enabling it moved CPU utilisation 72.3% → 83.0% and mean wait 1896.7 → 396.1 min"
kind = "reproduce"
expect = ["compare-backfill seed 5: cpu utilization 72.3% -> 83.0%, mean wait 1896.7 -> 396.1 min"]

[[claim]]
id = "scheduler-headline-source"
profile = "`schedlab --compare-backfill --jobs 300 --seed 5`"
kind = "source"
repo = "slurm-scheduler-lab"
path = "README.md"
expect = [
  "schedlab --compare-backfill --jobs 300 --seed 5",
  "trace: synthetic (seed=5)",
  "cpu utilization 72.3 %",
  "cpu utilization 83.0 %",
  "mean wait 1896.7 min",
  "mean wait 396.1 min",
  "No live controller behind any number here.",
]

[[claim]]
id = "scheduler-fleet"
profile = "16 nodes × 8 CPU / 2 GPU, conservative backfill, Fair Tree"
kind = "source"
repo = "slurm-scheduler-lab"
path = "README.md"
expect = ["300 jobs · 16 nodes × 8 CPU / 2 GPU", "model: conservative backfill · fairshare fair_tree"]

[[claim]]
id = "scheduler-backfill-range"
profile = "across seeds 0–9 it cut mean wait 2.2x-5.7x"
kind = "reproduce"
expect = ["backfill mean-wait cut, seeds 0-9: 2.2x-5.7x"]

[[claim]]
id = "scheduler-weight-age"
profile = "at most 1.26x for age"
kind = "reproduce"
expect = ["age 1.01x-1.26x"]

[[claim]]
id = "scheduler-weight-others"
profile = "by 1.13x-1.84x for fairshare, 1.50x-2.81x for QOS and 2.15x-3.87x for job size"
kind = "reproduce"
expect = ["fairshare 1.13x-1.84x", "qos 1.50x-2.81x", "jobsize 2.15x-3.87x"]

[[claim]]
id = "scheduler-exact-limits"
profile = "raised CPU utilisation on 7/10 seeds but also raised mean wait on 9/10"
kind = "reproduce"
expect = ["mean wait higher on 9/10, cpu utilization higher on 7/10"]

[[claim]]
id = "scheduler-exact-limits-source"
profile = "Setting every limit equal to its job's runtime"
kind = "source"
repo = "slurm-scheduler-lab"
path = "README.md"
expect = ["exact limits raised utilization on 7 of 10 seeds. They also raised mean wait on 9 of 10"]

[[claim]]
id = "k8s-status"
profile = "**Built:** K0 (default kube-scheduler) and four degenerate baselines"
kind = "source"
repo = "k8s-gpu-scheduler-lab"
path = "README.md"
expect = [
  "| **K0** | default `kube-scheduler` + device plugin | **built** |",
  "| K1 | + Kueue (quota, admission) | planned |",
  "| K2 | + Volcano (gang, DRF) | planned |",
  "| K4 | NVIDIA KAI + DRA | planned |",
  "| D-preempt |",
  "No cluster run has been made with the Phase 2 harness yet",
]

[[claim]]
id = "k8s-fragmentation"
profile = "largest-first baseline scored **0.0%** fragmentation under a queue-relative definition and **55.6%** under a queue-independent one"
kind = "source"
repo = "k8s-gpu-scheduler-lab"
path = "README.md"
expect = ["reports 0.0% fragmentation under definition A** and 55.6% under definition B"]

[[claim]]
id = "k8s-run2"
profile = "Run 2, 800 jobs / 1201 pods on a 140-GPU heterogeneous fleet, Phase 1 harness"
kind = "source"
repo = "k8s-gpu-scheduler-lab"
path = "README.md"
expect = ["### Run 2 — 800 jobs / 1201 pods, 140-GPU heterogeneous fleet", "every cluster number below is Phase 1's"]

[[claim]]
id = "k8s-34-unverified"
profile = "the \"34% at KubeCon EU 2026\" figure the lab was started to test, whose source I could not verify"
kind = "source"
repo = "k8s-gpu-scheduler-lab"
path = "README.md"
expect = ["is **unverified**, in both its value and its attribution"]

[[claim]]
