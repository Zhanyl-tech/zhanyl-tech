  "Slinky v1.2 ships Slurm 26.05",
  "Status: the rotation does not currently succeed on Slinky v1.2.",
  "and exits 3",
  "Not re-run on a cluster since the September 2026 changes.",
  "One nodeset, one replica.",
  "No GitOps controller.",
  "it has not been filed",
]

# What CI on kind observed, which predates the exit-3 rewrite. The runs are
# the last three rows of slinky-gitops' "What CI caught" table.
[[claim]]
id = "slinky-ci-runs"
profile = "In three kind CI runs (commits `8e742be` to `c51903a`) the rotation exited non-zero instead of reporting success, and the cluster ran a job afterwards; the run logs, which would show the rollback, were not re-read."
kind = "source"
repo = "slinky-gitops"
path = "README.md"
expect = [
  "| `8e742be` | success | rotation step \"✓\": exited non-zero after 404 s; job ran afterwards |",
  "| `044e01c` | success | same (410 s) |",
  "| `c51903a` | success | same (419 s) |",
  "so its \"✓\" means only that the rotation exited non-zero",
  "so the table does not claim which check fired",
]

# The exit-3 contract has run only offline, and the CI step that asserts it
# has not run. Both README passages that say so are pinned, so the caveat
# cannot drop out of one.
[[claim]]
id = "slinky-rewrite-offline-only"
profile = "So far the script has run only in offline tests against a fake `kubectl`, and the new CI step has not run at all."
kind = "source"
repo = "slinky-gitops"
path = "README.md"
expect = [
  "Not re-run on a cluster since the September 2026 changes.",
  "covered by the offline tests (against a fake kubectl)",
  "the new steps of the KinD CI job are not exercised by anything offline",
  "make test # offline: the rotation script against a fake kubectl",
]

[[claim]]
id = "slinky-finding-offline-only"
profile = "It has so far run only in offline tests against a fake `kubectl`; the kind job has not run it yet."
kind = "source"
repo = "slinky-gitops"
path = "README.md"
expect = [
  "Not re-run on a cluster since the September 2026 changes.",
  "the KinD job has to run once before any of this counts as proven on a real cluster",
]

