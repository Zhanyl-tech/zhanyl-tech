kind = "source"
repo = "gpu-reaper"
path = "README.md"
expect = [
  "Status: v0.x, not yet run on a real cluster.",
  "Cancel needs a drain that was *executed and confirmed* at least one `window` earlier.",
  "larger than `max_sample_gap`, or a newest sample older than that, resets the breach clock *and* the escalation history.",
  "With the defaults (interval 2m, gap 3m) any failed cycle leaves such a hole.",
  "climbed again from Alert.",
  "The DCGM source has not been run against a real dcgm-exporter;",
]

